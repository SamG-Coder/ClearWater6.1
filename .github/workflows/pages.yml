name: Build and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check host and build scripts
        run: |
          node --check app.js
          node --check scripts/build.mjs
          node --check scripts/serve.mjs
          node --check scripts/verify.mjs
          node --check scripts/force-verify.mjs
          node --check scripts/mobile-verify.mjs
          node --check scripts/optimization-verify.mjs
          node --check scripts/pc-quality-verify.mjs
          node --check scripts/planet-verify.mjs
          node --check scripts/weather-verify.mjs
          node --check scripts/lighting-verify.mjs
          node --check scripts/geology-verify.mjs
          node --check scripts/continent-verify.mjs
      - name: Compile CUDA kernels and build static site
        run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
